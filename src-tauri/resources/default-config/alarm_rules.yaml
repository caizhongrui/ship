# 报警规则库（04.24 §2.3）
rules:
  - id: A_SCAV_PRESS_LOW
    tag: engine.scav.pressure
    op: '<'
    threshold: 3.0
    level: 2
    hold_sec: 5
    action: alert
    message: 扫气压力过低
  - id: A_CYL_EXH_HIGH
    tag: engine.cyl.*.exhaust_temp
    op: '>'
    threshold: 450
    level: 3
    hold_sec: 3
    action: [alert, log]
    message: 单缸排温超限
  - id: A_EXH_MANIFOLD_HIGH
    tag: engine.exh.manifold
    op: '>'
    threshold: 450
    level: 3
    hold_sec: 3
    action: [alert, log]
    message: 排烟总管温度过高
  - id: A_BEARING_TEMP_HIGH
    tag: shaft.bearing.intermediate.temp
    op: '>'
    threshold: 58
    level: 3
    hold_sec: 0
    action: [alert, suggest_stop]
    message: 中间轴承温度高（标称55℃，报警值58℃）
  - id: A_SHAFT_VIBRATION_HIGH
    tag: vibration.shaft.rms
    op: '>'
    threshold: 0.20
    level: 3
    hold_sec: 0
    action: [alert, log]
    message: 中间轴振动过大（传感器安装距离2mm，位移偏差大于0.20mm）
  - id: A_PMAX_HIGH
    tag: engine.cyl.*.pmax
    op: '>'
    threshold: 200
    level: 2
    hold_sec: 0
    action: [alert]
    message: 爆发压力超限
  - id: A_POWER_OVER
    tag: engine.power
    op: '>'
    threshold: 43000
    level: 3
    hold_sec: 0
    action: [alert]
    message: 输出功率超限
  - id: A_RPM_OVER
    tag: engine.rpm
    op: '>'
    threshold: 85
    level: 3
    hold_sec: 0
    action: [fuel_cut, air_brake]
    message: 主机超速
  - id: A_OVERLOAD_COMPOSITE
    type: composite
    expr: 'count_true([engine.power>43000, engine.rpm>85, engine.cyl.*.pmax>200, engine.exh.manifold>450, shaft.bearing.intermediate.temp>=58]) >= 2'
    level: 3
    hold_sec: 30
    action: [alert, log]
    message: 主机超负荷（复合判定）
