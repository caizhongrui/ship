# 主线剧本：正常加减车与轴系振动位移监测试验
scenario: mooring_test_main
duration_sec: 600
time_scale_default: 8

events:
  - at: 0
    cmd: telegraph.set
    args: STOP
  - at: 5
    cmd: telegraph.set
    args: DEAD_SLOW_AHEAD
  - at: 60
    cmd: telegraph.set
    args: SLOW_AHEAD
  - at: 120
    cmd: telegraph.set
    args: HALF_AHEAD
  - at: 200
    cmd: telegraph.set
    args: FULL_AHEAD
  - at: 280
    cmd: telegraph.set
    args: NAV_FULL
expected_alarms:
  - A_SHAFT_VIBRATION_HIGH
  - A_BEARING_TEMP_HIGH

scoring:
  - id: telegraph_compliance
    weight: 25
    desc: 车钟逐级加速合规
  - id: full_speed_stability
    weight: 25
    desc: 海速 80 rpm 时排温约 420℃且运行稳定
  - id: deceleration_compliance
    weight: 25
    desc: 正常逐级减车，无自动降速介入
  - id: shaft_alarm_accuracy
    weight: 25
    desc: 70 rpm 触发振动位移超差报警，75 rpm 触发中间轴承温度高报警
