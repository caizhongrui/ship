[package]
name = "ship-digital-twin"
version = "0.1.0"
description = "船舶数字孪生诊断系统"
authors = ["you"]
edition = "2021"

[lib]
name = "ship_digital_twin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
