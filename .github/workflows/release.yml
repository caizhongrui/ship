name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # 支持在 GitHub 网页上手动触发

# softprops/action-gh-release 需要 contents: write 才能创建 Release
permissions:
  contents: write

jobs:
  build-windows:
    name: Build (windows-latest, x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # === AI 推理模型（all-MiniLM-L6-v2 ONNX，~90MB），打入安装包 ===
      - name: Cache AI inference model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: ai-model-all-MiniLM-L6-v2-onnx-v1

      - name: Download AI inference model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          curl -L --fail --retry 3 \
            -o src-tauri/resources/models/embedding-model.onnx \
            "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx"
          ls -lh src-tauri/resources/models/

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (Windows installer)
        run: npm run tauri:build
        env:
          # Tauri 自带的更新签名（暂时不用，留空避免警告）
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Upload NSIS installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ShipDigitalTwin-nsis-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: ShipDigitalTwin-msi-${{ github.sha }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # 打 tag（如 v0.1.0）时，自动创建 Release 并把安装包附上去
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
